pre-commit:
  parallel: true
  commands:
    format:
      glob: '*.{ts,tsx,js,mjs,json,css,md,yml,yaml}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx}'
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
commit-msg:
  commands:
    commitlint:
      # No path after --edit: commitlint finds the message file itself, including in a git
      # worktree, where {1} is an absolute path that breaks on the space in "B:\Campus Hand".
      run: pnpm exec commitlint --edit
pre-push:
  commands:
    protect-branches:
      use_stdin: true
      run: node scripts/guard-push.mjs
